<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./components/header-footer.css">
    <link rel="stylesheet" href="./product-page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
        <div id="header"></div>

    <div class="products-page">
            <button id="filterToggle" class="filter-toggle">
                <span><i class="fa-solid fa-angle-right"></i></span>
            </button>
            <div class="filter-sidebar" id="filterSidebar">
                <div class="filter-group">
                    <h3>Filter by Brand</h3>
                    <div class="filter-options" id="brandFilters"></div>
                </div>
                <div class="filter-group">
                    <h3>Price Range</h3>
                    <div class="price-inputs">
                        <input type="number" id="minPrice" placeholder="Min" min="0" max="1000">
                        <input type="number" id="maxPrice" placeholder="Max" min="0" max="1000">
                    </div>
                    <div class="price-slider-container">
                        <div class="price-values">
                          <span id="minPriceValue">$0</span> - <span id="maxPriceValue">$1000</span>
                        </div>
                        <div class="slider">
                          <input type="range" id="minPriceSlider" min="0" max="1000" value="0">
                          <input type="range" id="maxPriceSlider" min="0" max="1000" value="1000">
                        </div>
                      </div>                      
                </div>
                <button id="resetFilters" class="reset-filters">Reset Filters</button>
            </div>
        <div class="products-grid" id="productsContainer">
            <div class="loading">Loading products...</div>
        </div>
    </div>
    


        <div id="footer"></div>


    <script src="./js/cart.js"></script>
    <script src="./js/productData.js"></script>
    <script src="./products.js"></script>
    <script src="./components/header.js"></script>
</body>
</html>
