<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./components/header-footer.css">
    <link rel="stylesheet" href="./product-page.css">
</head>
<body>
        <div id="header"></div>

    <div class="products-page">
            <button id="filterToggle" class="filter-toggle">
                <span>☰</span> Filters
            </button>
            <div class="filter-sidebar" id="filterSidebar">
                <div class="filter-group">
                    <h3>Filter by Brand</h3>
                    <div class="filter-options" id="brandFilters"></div>
                </div>
                <div class="filter-group">
                    <h3>Price Range</h3>
                    <input type="range" id="priceRange" min="0" max="1000" value="1000">
                    <span id="priceValue">$1000</span>
                </div>
            </div>
        <div class="products-grid" id="productsContainer">
            <div class="loading">Loading products...</div>
        </div>
    </div>
    


        <div id="footer"></div>


    <script src="./js/cart.js"></script>
    <script src="./js/productData.js"></script>
    <script src="./products.js"></script>
    <script src="./components/header.js"></script>
</body>
</html>
